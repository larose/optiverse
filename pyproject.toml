[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optiverse"
version = "0.0.2"
description = "Optimization framework using Large Language Models"
authors = [{ name = "Mathieu Larose", email = "mathieu@mathieularose.com" }]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The core is the search loop, the store and two process contracts (the
# evaluator command, the generator). None of that needs a third-party package.
dependencies = []

[project.optional-dependencies]
# The mini-swe-agent generator. Optional because it pulls litellm, datasets and
# textual, which nobody wanting only the loop should have to install.
agent = ["mini-swe-agent==2.4.6"]
dev = [
    "black==25.1.0",
    "build==1.2.2.post1",
    "pyright==1.1.403",
    "twine==6.1.0",
]

[project.urls]
Homepage = "https://github.com/larose/optiverse"
Repository = "https://github.com/larose/optiverse"

[tool.setuptools]
packages = ["optiverse", "optiverse.generators", "optiverse.search_strategies"]

[tool.black]
target-version = ['py310']
include = '(examples|optiverse|tests).*\.py$'

[tool.pyright]
include = ["examples", "optiverse", "tests"]
# Seed codebases and harnesses are assembled into one flat directory at
# evaluation time, so `from context import Context` only resolves there. Tell
# pyright where the siblings live rather than dropping them from the checks.
extraPaths = ["examples/tsp/harness", "examples/tsp/initial"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingImports = true
reportUnusedImport = true
reportUnusedVariable = true
