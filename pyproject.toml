[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optiverse"
version = "0.1.0"
description = "Optimization framework using Large Language Models"
authors = [{ name = "Mathieu Larose", email = "mathieu@mathieularose.com" }]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
# The search loop, the store and the two process contracts need nothing. This is
# for AgentGenerator, the only generator that ships, which cannot run without
# it. Imported inside the methods that use it, so `import optiverse` still costs
# nothing.
dependencies = ["mini-swe-agent==2.4.6"]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "build==1.2.2.post1",
    "pyright==1.1.403",
    "twine==6.1.0",
]

[project.urls]
Homepage = "https://github.com/larose/optiverse"
Repository = "https://github.com/larose/optiverse"

[tool.setuptools]
packages = ["optiverse", "optiverse.generators", "optiverse.search_strategies"]

[tool.black]
target-version = ['py310']
include = '(examples|optiverse|tests).*\.py$'

[tool.pyright]
include = ["examples", "optiverse", "tests"]
# Seed codebases and harnesses are assembled into one flat directory at
# evaluation time, so `from context import Context` only resolves there. Tell
# pyright where the siblings live rather than dropping them from the checks.
extraPaths = [
    "examples/integer_compression/harness",
    "examples/tsp/harness",
    "examples/tsp/initial",
]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingImports = true
reportUnusedImport = true
reportUnusedVariable = true
